# SonarQube Cloud — automatic analysis configuration.
#
# Automatic analysis reads THIS file. A sonar-project.properties file is
# ignored unless you switch to CI-based analysis, so keep settings here.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis

sonar.sources=.

# Exclusions:
#   _site/**            generated Jekyll output (gitignored; listed defensively)
#   _data/products.csv  generated by `make csv` from a Google Sheet, never hand-edited
#   email/template.html legacy HTML-email template for the external mailer. It is
#                       deliberately table-based with inline styles and is full of
#                       {{ placeholder }} tokens that are not Jekyll variables, so
#                       web rules produce only false positives here.
#   *.lock              dependency lockfiles
#   sitemap.xml         carries Jekyll front matter ahead of the XML
#                       declaration. Jekyll strips it at build time (the file
#                       in _site/ starts correctly with "<?xml"), but the XML
#                       analyzer reads the source and cannot parse Liquid front
#                       matter, so every rule it reports here is a false
#                       positive about a file that is valid once built.
sonar.exclusions=_site/**,_data/products.csv,email/template.html,**/*.lock,sitemap.xml

# The .html files are Jekyll/Liquid templates rather than plain HTML. Liquid tags
# ({% ... %} / {{ ... }}) may trigger some HTML rules; prefer muting the specific
# rule in the SonarQube Cloud UI over excluding the templates wholesale, since the
# product and layout templates are where most of the value is.
