<section class="page-section" id="quote">
  <div class="container">
    <div class="d-flex">
      <div class="p-2"><h2>Your Quote</h2></div>
      <div class="p-2"></div>
      <div class="ms-auto p-2">
        <a href="#quote" onclick="emptyQuote();"><i class="fas fa-dumpster-fire fa-2x"></i></a>
      </div>
    </div>
    <form id="quote-form">
      <input type="hidden" id="form-type" name="form-type" value="quote-request" />
      <div class="table-responsive">
      <table id="quote-table" class="table table-hover">
        <thead>
          <tr>
            <th scope="col">Item</th>
            <th scope="col" class="text-center">SKU</th>
          </tr>
        </thead>
        <tbody id="quote-contents">
        </tbody>
      </table>
      </div>
      <hr class="my-4" />
      <div id="quote-form-client" class="d-none">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" name="name" id="name" placeholder="John Doe" required>
        </div>
        <div class="mb-3">
          <label for="company" class="form-label">Company</label>
          <input type="text" class="form-control" name="company" id="company" placeholder="Example, LLC">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" name="email" id="email" placeholder="jdoe@example.com" required>
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="tel" class="form-control" name="phone" id="phone" placeholder="(555) 555-5555">
        </div>
        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <input type="text" class="form-control" name="address" id="address" placeholder="1234 Main St" required>
        </div>
        <div class="mb-3">
          <label for="address2" class="form-label">Address 2</label>
          <input type="text" class="form-control" name="address2" id="address2" placeholder="Apartment, studio, or floor">
        </div>
        <div class="row g-3">
          <div class="col-md-6 mb-3">
            <label for="city" class="form-label">City</label>
            <input type="text" class="form-control" name="city" id="city" placeholder="Hagerstown" required>
          </div>
          <div class="col-md-4 mb-3">
            <label for="state" class="form-label">State</label>
            <select name="state" id="state" class="form-select" required>
              <option selected>Choose...</option>
              <option value="AL">AL</option>
              <option value="AK">AK</option>
              <option value="AR">AR</option>
              <option value="AZ">AZ</option>
              <option value="CA">CA</option>
              <option value="CO">CO</option>
              <option value="CT">CT</option>
              <option value="DC">DC</option>
              <option value="DE">DE</option>
              <option value="FL">FL</option>
              <option value="GA">GA</option>
              <option value="HI">HI</option>
              <option value="IA">IA</option>
              <option value="ID">ID</option>
              <option value="IL">IL</option>
              <option value="IN">IN</option>
              <option value="KS">KS</option>
              <option value="KY">KY</option>
              <option value="LA">LA</option>
              <option value="MA">MA</option>
              <option value="MD">MD</option>
              <option value="ME">ME</option>
              <option value="MI">MI</option>
              <option value="MN">MN</option>
              <option value="MO">MO</option>
              <option value="MS">MS</option>
              <option value="MT">MT</option>
              <option value="NC">NC</option>
              <option value="NE">NE</option>
              <option value="NH">NH</option>
              <option value="NJ">NJ</option>
              <option value="NM">NM</option>
              <option value="NV">NV</option>
              <option value="NY">NY</option>
              <option value="ND">ND</option>
              <option value="OH">OH</option>
              <option value="OK">OK</option>
              <option value="OR">OR</option>
              <option value="PA">PA</option>
              <option value="RI">RI</option>
              <option value="SC">SC</option>
              <option value="SD">SD</option>
              <option value="TN">TN</option>
              <option value="TX">TX</option>
              <option value="UT">UT</option>
              <option value="VT">VT</option>
              <option value="VA">VA</option>
              <option value="WA">WA</option>
              <option value="WI">WI</option>
              <option value="WV">WV</option>
              <option value="WY">WY</option>
            </select>
          </div>
          <div class="col-md-2 mb-3">
            <label for="zip" class="form-label">Zip</label>
            <input type="text" class="form-control" name="zip" id="zip" placeholder="21740" required>
          </div>
        </div>
        <hr class="my-4" />
        <div class="cf-turnstile" data-sitekey="{{ site.turnstile.site_key }}" data-size="invisible"></div>
        <input type="submit"
               class="btn btn-primary btn-lg w-100"
               id="submit-quote" name="submit" value="Request a Quote">
      </div>
      <div id="quote-form-success" class="text-center d-none" role="alert" aria-live="assertive" aria-atomic="true">
        <h4>Quote request submitted to sales.</h4>
      </div>
      <div id="quote-form-error" class="text-center d-none" role="alert" aria-live="assertive" aria-atomic="true">
        <h4>Error submitting quote request.</h4>
      </div>
    </form>
  </div>
</section>
