<nav aria-label="Breadcrumb" class="container mt-5 pt-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="/">Home</a></li>
    {% if page.url contains '/products/' and page.url != '/products/' %}
      <li class="breadcrumb-item"><a href="/products/">Products</a></li>
      <li class="breadcrumb-item active" aria-current="page">{{ page.title }}</li>
    {% elsif page.url contains '/learning-center' %}
      <li class="breadcrumb-item"><a href="/learning-center.html">Learning Center</a></li>
      <li class="breadcrumb-item active" aria-current="page">{{ page.title }}</li>
    {% endif %}
  </ol>
</nav>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "Home", "item": "{{ site.url }}/"},
    {% if page.url contains '/products/' and page.url != '/products/' %}
      {"@type": "ListItem", "position": 2, "name": "Products", "item": "{{ site.url }}/products/"},
      {"@type": "ListItem", "position": 3, "name": "{{ page.title }}", "item": "{{ site.url }}{{ page.url }}"}
    {% elsif page.url contains '/learning-center' %}
      {"@type": "ListItem", "position": 2, "name": "Learning Center", "item": "{{ site.url }}/learning-center.html"},
      {"@type": "ListItem", "position": 3, "name": "{{ page.title }}", "item": "{{ site.url }}{{ page.url }}"}
    {% endif %}
  ]
}
</script>
