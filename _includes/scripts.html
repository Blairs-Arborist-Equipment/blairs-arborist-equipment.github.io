<!-- Bootstrap 5 JS Bundle-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- Cloudflare Turnstile-->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<!-- Site config for the static JS below. Keeping this here lets js/*.js stay
     plain JavaScript instead of Liquid-templated files. -->
<script>
  window.BAE_CONFIG = { mailerUrl: {{ site.mailer.url | jsonify }} };
</script>
<!-- Core theme JS-->
<script src="/js/scripts.js"></script>
<script src="/js/quote.js"></script>
<script src="/js/products-view.js"></script>
{% if page.name == 'quote.html' %}
  <script>
    quoteShowAll();
  </script>
{% endif %}
{% if page.url contains '/products/' %}
  <script src="/js/search.js"></script>
{% endif %}
